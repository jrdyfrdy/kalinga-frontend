<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/kalinga-logo.svg" />
    <link rel="apple-touch-icon" href="/kalinga-mobile-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173d1d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101814" media="(prefers-color-scheme: dark)" />
    <title>Kalinga</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      (function () {
        try {
          var pref = localStorage.getItem("theme") || "system";
          var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
